name: Build and Deploy (Android & Windows)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Create .env File
        env:
          APP_ENV_CONTENT: ${{ secrets.APP_ENV_FILE }}
        run: |
          if [ -n "$APP_ENV_CONTENT" ]; then
            printf "%s\n" "$APP_ENV_CONTENT" > .env
          else
            cp .env.example .env
          fi

      - name: Build APK with Semantic Versioning
        run: |
          VERSION_NAME=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "Building Android APK version: $VERSION_NAME (build: ${{ github.run_number }})"
          flutter build apk --release --build-name="$VERSION_NAME" --build-number=${{ github.run_number }}

      - name: Configure AWS Credentials for Cloudflare R2
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: auto

      - name: Upload APK to Cloudflare R2
        run: |
          aws s3 cp build/app/outputs/flutter-apk/app-release.apk s3://${{ secrets.R2_BUCKET_NAME }}/android/sollu-pos-android-${{ github.ref_name }}.apk \
            --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        env:
          AWS_REGION: auto

  build-windows:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Create .env File
        env:
          APP_ENV_CONTENT: ${{ secrets.APP_ENV_FILE }}
        shell: pwsh
        run: |
          if ($env:APP_ENV_CONTENT) {
            [System.IO.File]::WriteAllText(".env", $env:APP_ENV_CONTENT)
          } else {
            Copy-Item -Path .env.example -Destination .env
          }

      - name: Build Windows with Semantic Versioning
        shell: pwsh
        run: |
          $VersionName = "${{ github.ref_name }}" -replace "^v", ""
          Write-Host "Building Windows version: $VersionName (build: ${{ github.run_number }})"
          flutter build windows --release --build-name="$VersionName" --build-number=${{ github.run_number }}

      - name: Compress Build Folder
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath sollu-pos-windows-${{ github.ref_name }}.zip

      - name: Configure AWS Credentials for Cloudflare R2
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws-region: auto

      - name: Upload ZIP to Cloudflare R2
        run: |
          aws s3 cp sollu-pos-windows-${{ github.ref_name }}.zip s3://${{ secrets.R2_BUCKET_NAME }}/windows/sollu-pos-windows-${{ github.ref_name }}.zip --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        env:
          AWS_REGION: auto
